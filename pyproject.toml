[project]
name = "youtube-agent"
version = "0.1.0"
description = "Topic-to-content YouTube agent: script, TTS audio, multi-platform metadata, and thumbnails via FastAPI + Ollama."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
